<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="ball"><circle cx="50" cy="50" r="46"/></clipPath>
  </defs>

  <!-- LTU flag: yellow top, green middle, red bottom -->
  <circle cx="50" cy="50" r="46" fill="#FAB912"/>
  <rect x="4" y="35" width="92" height="31" fill="#006A44" clip-path="url(#ball)"/>
  <rect x="4" y="66" width="92" height="30" fill="#C1272D"  clip-path="url(#ball)"/>

  <!-- Basketball seam lines -->
  <!-- Left parenthesis seam -->
  <path d="M50 4 Q26 27 26 50 Q26 73 50 96"
        fill="none" stroke="#1A0800" stroke-width="3.5" stroke-linecap="round" clip-path="url(#ball)"/>
  <!-- Right parenthesis seam -->
  <path d="M50 4 Q74 27 74 50 Q74 73 50 96"
        fill="none" stroke="#1A0800" stroke-width="3.5" stroke-linecap="round" clip-path="url(#ball)"/>
  <!-- Horizontal seam top arc -->
  <path d="M4 50 Q27 38 50 38 Q73 38 96 50"
        fill="none" stroke="#1A0800" stroke-width="3.5" stroke-linecap="round" clip-path="url(#ball)"/>
  <!-- Horizontal seam bottom arc -->
  <path d="M4 50 Q27 62 50 62 Q73 62 96 50"
        fill="none" stroke="#1A0800" stroke-width="3.5" stroke-linecap="round" clip-path="url(#ball)"/>

  <!-- Outer border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#1A0800" stroke-width="4"/>
</svg>
